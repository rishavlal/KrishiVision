<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="leafGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="leafGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800&amp;family=Tiro+Devanagari+Hindi&amp;display=swap');
    .hindi-brand {
      font-family: 'Tiro Devanagari Hindi', 'Noto Sans Devanagari', 'Mangal', 'Segoe UI', serif;
      font-weight: 700;
      font-size: 44px;
      fill: #064e3b;
    }
    .english-brand {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #10b981;
      letter-spacing: -0.5px;
    }
    .tagline {
      font-family: 'Inter', sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 2.2px;
      fill: #475569;
    }
    .tech-node {
      fill: #34d399;
      animation: pulse 2s infinite ease-in-out;
    }
  </style>

  <!-- Background decorative glow -->
  <circle cx="200" cy="95" r="75" fill="#ecfdf5" opacity="0.8" />

  <!-- ================= LEAF SYMBOL ABOVE ================= -->
  <g id="leaf-symbol" transform="translate(200, 95)">
    <!-- Main Left Leaf -->
    <path d="M 0,-65 C -45,-35 -55,15 -18,48 C -6,58 0,62 0,62 C 0,62 6,58 18,48 C -15,20 -10,-25 0,-65 Z"
          fill="url(#leafGradLeft)"
          filter="url(#softGlow)" opacity="0.3" />
    <path d="M 0,-65 C -45,-35 -55,15 -18,48 C -6,58 0,62 0,62 C 0,62 6,58 18,48 C -15,20 -10,-25 0,-65 Z"
          fill="url(#leafGradLeft)" />

    <!-- Main Right Leaf / Fold -->
    <path d="M 0,-65 C 10,-25 15,20 -18,48 C 0,62 0,62 0,62 C 0,62 25,45 42,15 C 55,-10 35,-48 0,-65 Z"
          fill="url(#leafGradRight)" />

    <!-- Central Tech Vein / Sprout Axis -->
    <path d="M 0,-55 Q -2,0 0,60"
          stroke="url(#stemGrad)"
          stroke-width="3"
          stroke-linecap="round"
          fill="none" />

    <!-- Lateral Neural / Biological Veins (connecting AI & Nature) -->
    <path d="M -2,-20 Q -18,-15 -28,-3"
          stroke="#6ee7b7"
          stroke-width="2"
          stroke-linecap="round"
          fill="none"
          opacity="0.85" />
    <path d="M 0,-5 Q 16,-2 26,10"
          stroke="#34d399"
          stroke-width="2"
          stroke-linecap="round"
          fill="none"
          opacity="0.85" />
    <path d="M -1,15 Q -14,22 -22,32"
          stroke="#6ee7b7"
          stroke-width="2"
          stroke-linecap="round"
          fill="none"
          opacity="0.85" />

    <!-- AI Circuit Node Accent -->
    <circle cx="-28" cy="-3" r="3" fill="#a7f3d0" />
    <circle cx="26" cy="10" r="3" fill="#a7f3d0" />
    <circle cx="-22" cy="32" r="2.5" fill="#a7f3d0" />
    <circle cx="0" cy="-55" r="3.5" fill="#fbbf24" />

    <!-- Secondary Small Sprout on Right -->
    <path d="M 12,38 C 30,30 38,12 36,0 C 26,8 20,24 12,38 Z"
          fill="url(#goldGlow)"
          opacity="0.9" />
  </g>

  <!-- ================= TEXT BELOW LEAF ================= -->
  <!-- Project Name: कृषिVision -->
  <g transform="translate(200, 218)" text-anchor="middle">
    <text y="0">
      <tspan class="hindi-brand">कृषि</tspan><tspan class="english-brand">Vision</tspan>
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(200, 246)" text-anchor="middle">
    <text class="tagline">SMARTER DECISIONS · BETTER FARMING</text>
  </g>

  <!-- Elegant Divider Accent -->
  <g transform="translate(200, 266)">
    <line x1="-70" y1="0" x2="-15" y2="0" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="0" cy="0" r="3" fill="#10b981" />
    <line x1="15" y1="0" x2="70" y2="0" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>